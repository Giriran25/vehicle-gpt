services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vehiclegpt
      POSTGRES_USER: vehiclegpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehiclegpt -d vehiclegpt"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://vehiclegpt:${POSTGRES_PASSWORD:-local_demo_change_me}@db:5432/vehiclegpt
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
